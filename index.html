<!-- Request Demo Pop-up Modal -->
<div id="demoModal" class="fixed inset-0 z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
    <!-- Dark transparent backdrop that closes the modal when clicked -->
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm cursor-pointer" onclick="closeModal()"></div>
    
    <!-- Modal Content Box -->
    <div class="relative bg-surface w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden border border-white/10 m-4 flex flex-col transform scale-95 transition-transform duration-300" style="height: 85vh;" id="modalContent">
        <!-- Header -->
        <div class="flex justify-between items-center p-6 bg-surface-container-high border-b border-white/5">
            <h3 class="text-2xl font-bold text-white tracking-tight">Request a Demo</h3>
            <button onclick="closeModal()" class="text-on-surface-variant hover:text-white transition-colors flex items-center justify-center p-2 rounded-full hover:bg-white/5">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        <!-- Iframe container -->
        <div class="flex-grow w-full bg-white overflow-hidden">
            <iframe 
                src="https://docs.google.com/forms/d/e/1FAIpQLSctyT4y7L2ItOihTHxSUU-OkM241YyR1-sx0wmN1U9tMCtdsA/viewform?embedded=true" 
                width="100%" 
                height="100%" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">Loading…
            </iframe>
        </div>
    </div>
</div>

<!-- JavaScript to control the Modal -->
<script>
    function openModal() {
        const modal = document.getElementById('demoModal');
        const modalContent = document.getElementById('modalContent');
        
        // Show modal and prevent background scrolling
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        
        // Slight delay to trigger the CSS transition for a smooth fade-in
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
        }, 10);
    }

    function closeModal() {
        const modal = document.getElementById('demoModal');
        const modalContent = document.getElementById('modalContent');
        
        // Trigger fade-out animation
        modal.classList.add('opacity-0');
        modalContent.classList.add('scale-95');
        
        // Wait for animation to finish before hiding completely and restoring scroll
        setTimeout(() => {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }, 300);
    }
</script>
